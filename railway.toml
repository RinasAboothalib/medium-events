# Railway runs the backend: the API plus the admin app it serves (Backend/server, Frontend/admin).
# The public website is hosted on Netlify (netlify.toml).
[build]
  # Builds the admin app and the server (same as the root "build" script, Railway's default)
  buildCommand = "npm run build"

[deploy]
  startCommand = "npm start"
  healthcheckPath = "/api/health"
  # First start-up runs the database migrations and loads the seed events
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5
